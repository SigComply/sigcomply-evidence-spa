version: 2
updates:
  # npm dependencies (package.json / package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      # Batch React core updates so they land together (mismatched
      # versions across react / react-dom / react-router break things).
      react-core:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "@types/react"
          - "@types/react-dom"
      # Tooling moves fast; group patch/minor bumps to keep PR volume sane.
      build-tooling:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/plugin-react"
          - "typescript"
          - "tsx"
          - "@types/node"
        update-types:
          - "minor"
          - "patch"
      lint-tooling:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "globals"
        update-types:
          - "minor"
          - "patch"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "tw-animate-css"
    ignore:
      # TypeScript 7 cannot be installed while typescript-eslint 8.x is in
      # the tree: it declares a `typescript <6.1.0` peer range. Revisit when
      # typescript-eslint ships a release that accepts 7.
      - dependency-name: "typescript"
        versions: [">=7"]
      # Resolving vitest 5's peer set crashes npm's arborist ("Cannot read
      # properties of null (reading 'edgesOut')"), so the lockfile cannot be
      # regenerated with it. Revisit once npm or vitest fixes that.
      - dependency-name: "vitest"
        versions: [">=5"]
      # @vitejs/plugin-react 6.1+ pulls @rolldown/plugin-babel, which peers on
      # a @babel/core 8 release candidate that conflicts with Babel 7.
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=6.1"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
