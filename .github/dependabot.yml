version: 2
updates:
  # npm dependencies (package.json / package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    # Same 7-day age gate as `min-release-age` in .npmrc, so a PR never
    # proposes a version npm would refuse. Majors wait 30 days.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      # Batch React core updates so they land together (mismatched
      # versions across react / react-dom / react-router break things).
      react-core:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "@types/react"
          - "@types/react-dom"
      # Tooling moves fast; group patch/minor bumps to keep PR volume sane.
      build-tooling:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/plugin-react"
          - "typescript"
          - "tsx"
          - "@types/node"
        update-types:
          - "minor"
          - "patch"
      lint-tooling:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "globals"
        update-types:
          - "minor"
          - "patch"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "tw-animate-css"
    ignore:
      # `typescript` aliases @typescript/typescript6 (the TS 6 API that
      # typescript-eslint loads); `tsc -b` runs TS 7 from @typescript/native.
      # typescript-eslint 8.x peers on `typescript <6.1.0`, so a 7.x alias
      # can't install. Revisit when typescript-eslint accepts 7.
      - dependency-name: "typescript"
        versions: [">=7"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # Propose an action release only once it is 7 days old.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
