name: Security

# Security scans for the Manual Evidence SPA. This is a purely client-side
# React + Vite app deployed to GitHub Pages — no backend, no data storage,
# no auth — so the realistic threat surface is:
#   - supply-chain compromise via npm packages (biggest risk)
#   - XSS / unsafe-eval / prototype pollution in app code
#   - vulnerable JS libraries shipped in the built bundle
#   - accidental secrets committed to the repo
#   - missing security headers on the deployed site (mostly a Pages concern,
#     surfaced here for visibility)
#
# Scope is intentionally tighter than the CLI's security workflow — no
# license-compliance, no Go-specific scanners. The pre-deploy
# `npm audit --audit-level=high` gate in deploy.yml is kept as a hard
# blocker; this workflow is the broader read on every push, PR, and weekly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  # ===========================================
  # SUPPLY CHAIN SECURITY
  # ===========================================

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write  # for comment-summary-in-pr
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # AGPL/GPL-3.0 in a *shipped* SPA bundle would propagate the
          # license to downstream users. CI-only tooling is fine; runtime
          # deps are the concern.
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  osv-scanner:
    name: OSV Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          # Recursive scan auto-detects package-lock.json. Avoids the
          # --lockfile= trap that sank the CLI's first OSV setup (see
          # sigcomply-cli commit a932bb6).
          scan-args: |-
            --recursive
            --format=sarif
            --output-file=osv-results.sarif
            ./
        continue-on-error: true  # SARIF upload handles findings

      - name: Upload OSV Scanner results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: osv-results.sarif
        if: always()
        continue-on-error: true  # May fail on private repos without GitHub Advanced Security

  # Repo hygiene (pinned actions, token permissions, branch protection) as
  # scored by OpenSSF; findings go to code scanning, the job never blocks.
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write  # SARIF upload
      id-token: write  # publish_results signing
      actions: read  # workflow analysis
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
        continue-on-error: true

      - name: Upload Scorecard results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard-results.sarif
        if: always()
        continue-on-error: true  # May fail on private repos without GitHub Advanced Security

  # ===========================================
  # STATIC APPLICATION SECURITY TESTING (SAST)
  # ===========================================

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript-typescript"

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload
    # Pinned by digest so a re-pushed tag can't change what runs. Harden-Runner
    # skips container jobs, so this job has none. Bump: a release at least 7
    # days old, then `docker buildx imagetools inspect semgrep/semgrep:<ver>`.
    container:
      image: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocking: a finding fails the job and the summary. Fix it, or for a
      # confirmed false positive add `// nosemgrep: <rule-id>` with the reason
      # on the line; never ignore a whole file.
      - name: Run Semgrep
        run: semgrep ci --sarif --output=semgrep.sarif
        env:
          SEMGREP_RULES: >-
            p/javascript
            p/typescript
            p/react
            p/security-audit
            p/owasp-top-ten
            p/secrets

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
        if: always()
        continue-on-error: true  # May fail on private repos without GitHub Advanced Security

  # ===========================================
  # VULNERABILITY SCANNING
  # ===========================================

  trivy:
    name: Trivy Vulnerability Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # The action's default Trivy moves with the action; pin it here.
          version: 'v0.76.1'
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: 'trivy-fs.sarif'
        if: always()
        continue-on-error: true  # May fail on private repos without GitHub Advanced Security

  retire-js:
    name: Retire.js (vulnerable JS libs in bundle)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SPA
        run: npx vite build
        env:
          VITE_BASE_PATH: /

      - name: Run Retire.js on built bundle
        # Retire.js looks for known-vulnerable JS *runtime* libraries by
        # signature in the shipped bundle — complements OSV/npm-audit which
        # work off package-lock.json. `retire` is an exact-pinned devDependency,
        # so npx runs the locked copy and never fetches one.
        run: |
          npx --no -- retire --path dist --outputformat json --outputpath retire-report.json --exitwith 0
          findings=$(jq '.data | length' retire-report.json)
          {
            echo "## Retire.js Report"
            if [ "$findings" != "0" ]; then
              echo "⚠️ Vulnerable libraries detected in built bundle:"
              jq -r '.data[] | "- \(.file): \(.results[]?.component)@\(.results[]?.version)"' retire-report.json
            else
              echo "✅ No vulnerable libraries detected"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Retire.js report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: retire-js-report
          path: retire-report.json

  # ===========================================
  # WORKFLOW SECURITY
  # ===========================================

  # Static analysis of .github/workflows and dependabot.yml: unpinned actions,
  # template injection, excessive permissions, persisted credentials, cache
  # poisoning. Findings go to code scanning (SARIF); the job itself passes.
  # Suppress a reviewed finding inline with `# zizmor: ignore[<audit>]` and
  # say why on the same line.
  zizmor:
    name: zizmor (workflow audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # SARIF upload
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1

  # ===========================================
  # SECRET DETECTION
  # ===========================================

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans full history
          persist-credentials: false

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --only-verified

      # Blocking: a finding fails the job, and the summary job with it. For a
      # false positive, add its fingerprint (printed in the finding) to
      # .gitleaksignore; gitleaks reads that file from the repo root.
      - name: Gitleaks Secret Scan
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_<version>_linux_x64.tar.gz, from the release's
          # gitleaks_<version>_checksums.txt.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          "$dir/gitleaks" detect --source . --verbose --redact --exit-code 1

  # ===========================================
  # DYNAMIC APPLICATION SECURITY TESTING (DAST)
  # ===========================================

  zap-baseline:
    name: OWASP ZAP Baseline (built SPA)
    runs-on: ubuntu-latest
    # DAST against a static SPA: .zap/rules.tsv fails the job on what the
    # app's own files control (CSP meta tag, cross-domain scripts, known
    # vulnerable libraries, dangerous JS functions) and ignores the response
    # headers only GitHub Pages can set. Skip on PRs to keep the PR feedback
    # loop fast; push to main + weekly is enough.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SPA
        run: npx vite build
        env:
          VITE_BASE_PATH: /

      # Vite's own preview server from the lockfile, not a package fetched at
      # run time. ZAP runs in Docker on the host network, so 127.0.0.1 reaches it.
      - name: Serve built SPA in the background
        run: |
          npx --no -- vite preview --host 127.0.0.1 --port 8080 --strictPort &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/ > /dev/null; then
              echo "SPA is up"
              exit 0
            fi
            sleep 1
          done
          echo "SPA failed to start"
          exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://127.0.0.1:8080/'
          # Don't open an issue on findings (we don't want CI bots filing
          # noise against the repo); the artifact is enough.
          allow_issue_writing: false
          # FAIL rules in the rules file fail the job; -I keeps WARN advisory.
          fail_action: true
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -I'
          # Pinned by digest so a re-pushed tag can't change the scanner.
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238

  # ===========================================
  # SBOM
  # ===========================================

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          syft-version: v1.55.0

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          syft-version: v1.55.0

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json

  # ===========================================
  # SECURITY SUMMARY
  # ===========================================

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, osv-scanner, codeql, semgrep, trivy, retire-js, secret-scan]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check security job results
        env:
          NPM_AUDIT: ${{ needs.npm-audit.result }}
          OSV: ${{ needs.osv-scanner.result }}
          CODEQL: ${{ needs.codeql.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          TRIVY: ${{ needs.trivy.result }}
          RETIRE: ${{ needs.retire-js.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          {
            echo "## Security Scan Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| npm audit | $NPM_AUDIT |"
            echo "| OSV Scanner | $OSV |"
            echo "| CodeQL | $CODEQL |"
            echo "| Semgrep | $SEMGREP |"
            echo "| Trivy | $TRIVY |"
            echo "| Retire.js | $RETIRE |"
            echo "| Secret Scan | $SECRET_SCAN |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # npm-audit, semgrep and secret-scan are the hard gates: high+ CVEs
          # in deps, SAST findings and credential leaks. The rest are advisory
          # (continue-on-error or non-blocking).
          if [[ "$NPM_AUDIT" == "failure" ]] || [[ "$SEMGREP" == "failure" ]] || \
             [[ "$SECRET_SCAN" == "failure" ]]; then
            echo "❌ Critical security checks failed!" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ All critical security checks passed" >> "$GITHUB_STEP_SUMMARY"
