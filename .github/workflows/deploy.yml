name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Docs-only pushes don't change the site. Nothing in the build imports a
    # Markdown file.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.vale/**'
      - '.vale.ini'
  workflow_dispatch:
  # Daily, so a new CLI release's catalogs reach the site within a day
  # without a commit here (the build regenerates them from releases/latest).
  schedule:
    - cron: '0 7 * * *'

# Least privilege per job: the build (npm ci, the CLI download, every test)
# runs with a read-only token and no Pages or OIDC rights; only the small
# deploy job can publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Audit dependencies (fail on high/critical)
        run: npm audit --audit-level=high

      # The catalogs served by the deployed site are regenerated from the CLI
      # on every deploy (the `prebuild` step of `npm run build` shells out to
      # `sigcomply evidence catalog`). Without this step the build would fall
      # back to the committed JSON and silently serve stale catalogs.
      - name: Install SigComply CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Authenticated so the lookup gets the 1000/hr limit rather than the
          # 60/hr per-IP anonymous one shared Actions runners burn through; a
          # throttled response would yield a null tag and 404 the download.
          VERSION=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/SigComply/sigcomply-cli/releases/latest | jq -r .tag_name)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not resolve the latest sigcomply-cli release tag." >&2
            exit 1
          fi
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH="amd64" ;;
            aarch64|arm64) ARCH="arm64" ;;
          esac
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ASSET="sigcomply_${VERSION#v}_${OS}_${ARCH}.tar.gz"
          BASE="https://github.com/SigComply/sigcomply-cli/releases/download/${VERSION}"
          echo "Installing SigComply CLI ${VERSION} for ${OS}/${ARCH}"
          DL=$(mktemp -d)
          curl -fsSL -o "${DL}/${ASSET}" "${BASE}/${ASSET}"
          curl -fsSL -o "${DL}/checksums.txt" "${BASE}/checksums.txt"
          # Check the tarball against the release's checksums.txt before
          # extracting it. Exactly one line must name the asset.
          awk -v a="${ASSET}" '$2 == a' "${DL}/checksums.txt" > "${DL}/want.txt"
          [ "$(wc -l < "${DL}/want.txt")" -eq 1 ]
          (cd "${DL}" && sha256sum -c want.txt)
          tar xzf "${DL}/${ASSET}" -C "${DL}" sigcomply
          sudo mv "${DL}/sigcomply" /usr/local/bin/
          sigcomply version

      # `npm run build` = prebuild (fetch-catalogs) + tsc -b + vite build.
      # Regenerating the catalogs is fatal-on-error, and the typecheck runs
      # here too — do not degrade this back to a bare `npx vite build`.
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      # The same gate as ci.yml, run on this build (fresh CLI catalogs
      # included) before anything is uploaded. A red step stops the deploy.
      - name: Lint
        run: npm run lint

      - name: Unit and component tests with coverage floors
        run: npm run test:coverage

      - name: Hand the tested build to the E2E job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          retention-days: 1

  # Playwright on the exact dist/ built above, in Playwright's image: it ships
  # the browsers and their system libraries, so the deploy never waits on an
  # Ubuntu package mirror (a slow mirror stalled `install --with-deps` past
  # its timeout). Keep the tag equal to @playwright/test in package-lock.json.
  # Only a green run uploads the Pages artifact.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      # A no-op when the image matches the lockfile; downloads only the
      # browsers (no apt) if they ever drift apart.
      - name: Ensure Playwright browsers match the lockfile
        run: npx playwright install chromium webkit

      - name: E2E on the dist/ about to be deployed
        run: npm run test:e2e
        env:
          E2E_DIST: dist

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      # Only reached when every step above passed.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Publishes the artifact the e2e job tested. No checkout, no npm: the
  # only job holding pages: write and id-token: write runs no repo code.
  deploy:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Post-deploy smoke test against the live site: home loads a catalog and
  # /verify verifies a CLI envelope. Red here means the live site is broken.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Ensure Chromium matches the lockfile
        run: npx playwright install chromium

      - name: Smoke test the live site
        run: npm run test:e2e:live
        env:
          E2E_LIVE_URL: ${{ needs.deploy.outputs.page_url }}
