name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Audit dependencies (fail on high/critical)
        run: npm audit --audit-level=high

      # The catalogs served by the deployed site are regenerated from the CLI
      # on every deploy (the `prebuild` step of `npm run build` shells out to
      # `sigcomply evidence catalog`). Without this step the build would fall
      # back to the committed JSON and silently serve stale catalogs.
      - name: Install SigComply CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Authenticated so the lookup gets the 1000/hr limit rather than the
          # 60/hr per-IP anonymous one shared Actions runners burn through; a
          # throttled response would yield a null tag and 404 the download.
          VERSION=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/SigComply/sigcomply-cli/releases/latest | jq -r .tag_name)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not resolve the latest sigcomply-cli release tag." >&2
            exit 1
          fi
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH="amd64" ;;
            aarch64|arm64) ARCH="arm64" ;;
          esac
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          echo "Installing SigComply CLI ${VERSION} for ${OS}/${ARCH}"
          curl -fsSL "https://github.com/SigComply/sigcomply-cli/releases/download/${VERSION}/sigcomply_${VERSION#v}_${OS}_${ARCH}.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/sigcomply /usr/local/bin/
          sigcomply version

      # `npm run build` = prebuild (fetch-catalogs) + tsc -b + vite build.
      # Regenerating the catalogs is fatal-on-error, and the typecheck runs
      # here too — do not degrade this back to a bare `npx vite build`.
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
