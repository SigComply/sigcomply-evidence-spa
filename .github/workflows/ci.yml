# Per-push gate: the same checks as the local gate in docs/WORKFLOW.md, minus
# the catalog refresh (no CLI here; deploy.yml builds with the CLI and runs
# this gate again on the result before it uploads anything).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, typecheck, unit, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's image ships the browsers and their system libraries, so the
    # job never waits on an Ubuntu package mirror (a slow mirror once stalled
    # `playwright install --with-deps` past the job timeout). Keep the tag
    # equal to the @playwright/test version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Unit and component tests with coverage floors
        run: npm run test:coverage

      # Bundles the committed catalogs; deploy.yml runs the full
      # `npm run build` with the released CLI.
      - name: Build
        run: npx vite build

      # A no-op when the image matches the lockfile; downloads only the
      # browsers (no apt) if they ever drift apart.
      - name: Ensure Playwright browsers match the lockfile
        run: npx playwright install chromium webkit

      - name: E2E (Playwright, Pages-like server)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
